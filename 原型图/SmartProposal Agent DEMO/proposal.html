<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Proposal — 工作台 + Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF3B70;
    --pink-deep: #FF2D55;
    --ink: #1F1035;
    --muted: #9CA3AF;
    --line-pink: #F0E4EC;
    --agent-w: 360px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--ink);
    background: #F6F6F8;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Left: Agent panel ---------- */
  .agent-panel {
    position: relative;
    width: var(--agent-w);
    flex-shrink: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(rgba(255, 59, 112, 0.06) 0%, rgba(255, 255, 255, 0) 40%), #FFFFFF;
    border-right: 1px solid var(--line-pink);
    box-shadow: 4px 0 20px rgba(255, 59, 112, 0.08);
    transition: width .28s ease, opacity .2s ease;
    overflow: hidden;
    z-index: 5;
  }
  body.collapsed .agent-panel { width: 0; opacity: 0; border-right: none; }

  .agent-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line-pink);
    min-height: 68px;
  }
  .agent-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--pink), #FF7A9C);
    color: #fff; flex-shrink: 0;
  }
  .agent-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .agent-name { font-size: 15px; font-weight: 700; color: var(--pink); white-space: nowrap; }
  .agent-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7280; }
  .agent-status .dot { width: 7px; height: 7px; border-radius: 50%; background: #00B42A; }
  .btn-collapse {
    margin-left: auto;
    width: 30px; height: 30px;
    border: 1px solid var(--line-pink);
    border-radius: 8px;
    background: #FFF7FA;
    color: var(--pink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s;
  }
  .btn-collapse:hover { background: #FFF0F4; }

  .agent-msgs {
    flex: 1;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto;
  }
  .bubble {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .bubble.agent {
    align-self: flex-start;
    background: #FFF0F4;
    border: 1px solid var(--line-pink);
    border-top-left-radius: 4px;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--pink);
    color: #FFFFFF;
    border-top-right-radius: 4px;
  }
  .bubble.typing { color: var(--muted); font-style: italic; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chip {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--pink-tag-line, #F0D2E1);
    background: #FAF0F5;
    color: #6B7280;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--pink); color: var(--pink); }

  .agent-inputrow {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line-pink);
  }
  .agent-input {
    flex: 1;
    min-height: 44px; max-height: 110px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line-pink);
    background: #FCF8FA;
    font-family: inherit; font-size: 13.5px;
    color: var(--ink);
    resize: none; outline: none;
    line-height: 1.5;
  }
  .agent-input:focus { border-color: var(--pink); background: #fff; }
  .btn-send {
    width: 44px; height: 44px;
    border: none; border-radius: 12px;
    background: var(--pink-deep);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(255, 59, 112, 0.35);
    flex-shrink: 0;
    transition: filter .15s;
  }
  .btn-send:hover { filter: brightness(1.06); }

  /* ---------- Floating expand button (when collapsed) ---------- */
  .btn-expand {
    position: fixed;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--pink);
    background: #FFFFFF;
    color: var(--pink);
    display: none;
    align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 59, 112, 0.30);
    z-index: 6;
    transition: transform .15s;
  }
  .btn-expand:hover { transform: translateY(-50%) scale(1.06); }
  body.collapsed .btn-expand { display: flex; }

  /* ---------- Right: Proposal site ---------- */
  .site-area { flex: 1; min-width: 0; height: 100vh; position: relative; }
  .site-area iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #F7F8FA;
  }
</style>
</head>
<body>
  <aside class="agent-panel" id="agentPanel">
    <div class="agent-head">
      <span class="agent-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 5.6L20 9.7l-4.3 4 1 5.8L12 16.8l-4.7 2.7 1-5.8L4 9.7l5.9-2.1L12 2z"/></svg>
      </span>
      <span class="agent-title">
        <span class="agent-name">Smart Proposal Agent</span>
        <span class="agent-status"><span class="dot"></span>在线 · 随时提问</span>
      </span>
      <button class="btn-collapse" onclick="document.body.classList.add('collapsed')" title="收起 Agent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="agent-msgs" id="msgs">
      <div class="bubble agent">欢迎回来 👋 我已就绪。你可以让我推荐达人、创建活动、查询预检记录，或分析当前页面数据。</div>
      <div class="bubble agent">我看到了右侧的「达人推荐活动列表」。需要我帮你新建一个推荐任务，或总结某个活动的 KOL 名单吗？</div>
    </div>

    <div class="chips">
      <button class="chip" onclick="fillInput('帮我新建一个达人推荐任务')">新建推荐任务</button>
      <button class="chip" onclick="fillInput('总结当前活动的 KOL 分层结构')">总结 KOL 分层</button>
      <button class="chip" onclick="fillInput('查询最近的预检记录')">查预检记录</button>
      <button class="chip" onclick="fillInput('本季哪个内容赛道互动率最高？')">内容赛道洞察</button>
    </div>

    <div class="agent-inputrow">
      <textarea class="agent-input" id="chatInput" rows="1" placeholder="向 Agent 描述你的需求…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="btn-send" onclick="send()" title="发送">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5l19-8.5L3 3.5 3 10l12 2-12 2z"/></svg>
      </button>
    </div>
  </aside>

  <button class="btn-expand" onclick="document.body.classList.remove('collapsed')" title="展开 Agent">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 5.6L20 9.7l-4.3 4 1 5.8L12 16.8l-4.7 2.7 1-5.8L4 9.7l5.9-2.1L12 2z"/></svg>
  </button>

  <main class="site-area">
    <iframe src="../SmartProposal%20DEMO/smart-proposal-campaign-list.html" title="Smart Proposal"></iframe>
  </main>

<script>
  const msgs = document.getElementById('msgs');
  const input = document.getElementById('chatInput');

  function bubble(cls, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + cls;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  function fillInput(text) {
    input.value = text;
    input.focus();
  }

  const replies = [
    '收到！这是静态演示环境：在正式版本中，我会调用达人库、活动与预检数据来执行该任务。你可以点击左侧箭头收起我，专注浏览右侧工作台。',
    '好的，已记录你的需求。Demo 中我先给出示例回复——收起 Agent 后，右侧即为完整的 Smart Proposal 工作台（参考 UAT 快照）。',
    '明白！正式环境中我会直接在右侧页面为你创建任务并填充表单。演示阶段可继续用下方的快捷指令体验对话。'
  ];
  let replyIdx = 0;

  function send() {
    const text = input.value.trim();
    if (!text) return;
    bubble('user', text);
    input.value = '';
    const typing = bubble('agent typing', 'Agent 正在思考…');
    setTimeout(() => {
      typing.remove();
      bubble('agent', replies[replyIdx++ % replies.length]);
    }, 700);
  }
</script>
</body>
</html>
