<style>
  :root {
    --pink: #FF3B70;
    --pink-deep: #FF2D55;
    --pink-soft: #FF5C8A;
    --pink-bg: #FFF0F4;
    --ink: #1F1035;
    --ink-2: #1F1224;
    --gray-700: #374151;
    --gray-600: #6B7280;
    --gray-400: #9CA3AF;
    --line: #E5E7EB;
    --line-pink: #F0E4EC;
    --line-pink-2: #F3D4DE;
    --bg-root: #F6F6F8;
    --bg-main: #FAFAFC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    background: var(--bg-root);
    color: var(--ink);
    overflow: hidden;
  }
  svg { display: block; }

  .app {
    display: flex;
    height: 100vh;
    min-height: 720px;
    position: relative;
  }

  .tinted::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('assets/hero-model.png') center / cover no-repeat;
    opacity: 0.15;
    border-radius: inherit;
    pointer-events: none;
  }

  /* ---------- Main ---------- */
  .main {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: var(--bg-main);
    overflow-y: auto;
  }

  .main > * { position: relative; }
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .breadcrumbs .crumb { color: var(--gray-600); font-weight: 400; }
  .breadcrumbs .crumb.current { color: var(--pink); font-weight: 500; }
  .breadcrumbs .icon-wrapper { color: var(--gray-400); }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-select {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 200px;
    padding: 11px 16px;
    border-radius: 10px;
    background: #FFFFFF;
    border: 1px solid var(--line-pink);
    box-shadow: 0 2px 8px rgba(255, 59, 112, 0.08);
    font-size: 15px;
    font-weight: 500;
    color: var(--pink);
    cursor: pointer;
  }
  .brand-select .chev { color: var(--pink); }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--line-pink);
    margin-top: 32px;
  }

  /* ---------- Empty state ---------- */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  .flow-card-wrap { padding: 8px; width: 100%; max-width: 1072px; }
  .flow-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    border-radius: 16px;
    background: #FFFFFF;
    border: 1px solid var(--line-pink-2);
    box-shadow: 0 4px 16px rgba(31, 16, 53, 0.06);
  }
  .flow-row {
    position: relative;
    display: flex;
    height: 88px;
  }
  .flow-link {
    position: absolute;
    top: 17px;
    height: 2px;
    left: calc(12.5% + var(--i) * 25% + 28px);
    width: calc(25% - 56px);
    border-radius: 1px;
    background: var(--pink);
  }
  .flow-link::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border-left: 8px solid var(--pink);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .number-circle {
    width: 36px;
    height: 36px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--pink-soft) 0%, var(--pink-deep) 100%);
    box-shadow: 0 6px 14px -6px rgba(255, 59, 112, 0.60), 0 2px 4px rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
  }
  .step-label {
    font-size: 13px;
    font-weight: 600;
    color: #111827;
  }

  .empty-copy h2 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    text-align: center;
  }
  .empty-copy .empty-sub {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 400;
    color: #9CA3AF;
    text-align: center;
  }

  .create-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 16px 48px;
    height: 64px;
    border: none;
    border-radius: 20px;
    background: #FF0000;
    box-shadow: 0 8px 20px rgba(255, 59, 112, 0.35), 0 0 14px rgba(255, 59, 112, 0.20);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .create-button svg { width: 36px; height: 36px; }
  .create-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(255, 59, 112, 0.55), 0 0 22px rgba(255, 59, 112, 0.35);
  }
  .create-button:active { transform: translateY(0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .flow-card-wrap { padding: 0; }
    .flow-row { flex-wrap: wrap; height: auto; gap: 20px 0; }
    .flow-link { display: none; }
    .step { flex: 1 1 40%; }
    .main { padding: 24px; }
  }
</style>
